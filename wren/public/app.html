<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wren</title>
<meta name="description" content="Sign in to Wren, the reading tutor that listens.">
<meta name="theme-color" content="#2E5E4E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='11' fill='%232E5E4E'/%3E%3Cellipse cx='19.7' cy='23.4' rx='9.7' ry='8.6' fill='%23F3D2A8'/%3E%3Ccircle cx='23.5' cy='17.5' r='5.9' fill='%23F3D2A8'/%3E%3Ccircle cx='24.1' cy='16.1' r='1.5' fill='%231E2430'/%3E%3Cpath d='M27.8 16.7l4.6.8-4.6 1.4z' fill='%23F2BD45'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Nunito:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
body{min-height:100vh;min-height:100dvh}
#app{min-height:100vh;min-height:100dvh}
.boot{min-height:100vh;display:grid;place-items:center}
.spinner{width:34px;height:34px;border-radius:50%;border:3.5px solid var(--line);border-top-color:var(--brand);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.demo-banner{background:var(--sun-soft);color:var(--ink);font-size:13.5px;font-weight:700;text-align:center;padding:7px 16px}
.demo-banner a{color:inherit}

/* ---------- auth ---------- */
.auth{display:grid;grid-template-columns:1fr 1fr;min-height:100vh;min-height:100dvh}
.auth-art{background:var(--brand);color:var(--brand-ink);padding:40px 48px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.auth-art .logo{color:var(--brand-ink)}
.auth-art .logo svg rect{fill:rgba(255,255,255,.14)}
.auth-art h2{font-size:clamp(30px,3.4vw,44px);margin-top:auto;max-width:460px}
.auth-art p{opacity:.85;margin-top:14px;max-width:440px;font-size:17px}
.auth-art .wren-float{position:absolute;right:-30px;top:18%;opacity:.95;transform:rotate(-6deg)}
.auth-art ul{list-style:none;padding:0;margin:26px 0 0;display:grid;gap:10px;font-weight:700}
.auth-art li{display:flex;gap:10px;align-items:center}
.auth-art li svg{width:20px;height:20px;flex:none}
.auth-main{display:flex;flex-direction:column;padding:32px 24px}
.auth-top{display:flex;justify-content:space-between;align-items:center;max-width:440px;width:100%;margin:0 auto}
.auth-form{max-width:440px;width:100%;margin:auto;padding:32px 0}
.auth-form h1{font-size:34px}
.auth-form .sub{color:var(--ink-2);margin:8px 0 26px}
.pw-wrap{position:relative}
.pw-wrap .input{padding-right:70px}
.pw-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;font-weight:800;font-size:13.5px;color:var(--ink-2);cursor:pointer;padding:8px 10px;border-radius:8px}
.pw-toggle:hover{background:var(--surface-2)}
.meter{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:4px}
.meter i{height:5px;border-radius:3px;background:var(--surface-3)}
.meter[data-s="1"] i:nth-child(-n+1){background:var(--bad)}
.meter[data-s="2"] i:nth-child(-n+2){background:var(--warn)}
.meter[data-s="3"] i:nth-child(-n+3){background:var(--ok)}
.meter[data-s="4"] i{background:var(--ok)}
.divider{display:flex;align-items:center;gap:12px;color:var(--ink-3);font-size:13px;font-weight:700;margin:20px 0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.switch-line{text-align:center;color:var(--ink-2);margin-top:22px;font-size:15px}
.switch-line a{font-weight:800}
@media (max-width:860px){.auth{grid-template-columns:1fr}.auth-art{display:none}}

/* ---------- onboarding ---------- */
.ob{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.ob-top{display:flex;align-items:center;gap:16px;padding:18px 24px;max-width:820px;width:100%;margin:0 auto}
.ob-progress{flex:1;height:8px;border-radius:5px;background:var(--surface-3);overflow:hidden}
.ob-progress b{display:block;height:100%;background:var(--brand);border-radius:5px;transition:width .35s ease}
.ob-body{flex:1;display:flex;justify-content:center;padding:12px 20px 40px}
.ob-card{max-width:640px;width:100%}
.ob-card h1{font-size:clamp(28px,4vw,40px)}
.ob-card .sub{color:var(--ink-2);font-size:17.5px;margin:10px 0 26px}
.ob-actions{display:flex;justify-content:space-between;gap:12px;margin-top:30px;align-items:center}
.choice-grid{display:grid;gap:12px}
.choice-grid.cols-2{grid-template-columns:1fr 1fr}
.choice-grid.cols-5{grid-template-columns:repeat(5,1fr)}
.choice{position:relative;display:flex;gap:14px;align-items:center;padding:16px;border-radius:18px;border:2px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;transition:border-color .15s,background .15s,transform .1s}
.choice:hover{border-color:var(--ink-3)}
.choice[aria-pressed="true"],.choice:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice b{display:block;font-size:16.5px}
.choice small{display:block;color:var(--ink-2);font-size:14px;font-weight:600;line-height:1.4}
.choice.world{flex-direction:column;padding:0;overflow:hidden;align-items:stretch}
.choice.world .wimg{height:110px;display:grid;place-items:center}
.choice.world .wlabel{padding:10px 12px 12px;font-weight:800;text-align:center}
.age-row{display:flex;gap:10px;flex-wrap:wrap}
.age-row .choice{width:64px;height:64px;justify-content:center;font-family:var(--display);font-size:24px;font-weight:700;padding:0}
.avatars{display:flex;gap:10px;flex-wrap:wrap}
.avatars button{width:48px;height:48px;border-radius:50%;border:3px solid transparent;cursor:pointer;box-shadow:inset 0 0 0 2px rgba(0,0,0,.06)}
.avatars button[aria-pressed="true"]{border-color:var(--ink)}
.consent-box{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 20px;font-size:15px;max-height:280px;overflow:auto}
.consent-box h4{font-family:var(--sans);font-size:15px;font-weight:800;margin:14px 0 4px}
.consent-box h4:first-child{margin-top:0}
.consent-box ul{margin:4px 0;padding-left:20px;color:var(--ink-2)}
.plan-opt{display:flex;justify-content:space-between;align-items:center;gap:12px}
.plan-opt .amt{font-family:var(--display);font-size:26px;font-weight:600}
@media (max-width:640px){.choice-grid.cols-5{grid-template-columns:1fr 1fr}.choice-grid.cols-2{grid-template-columns:1fr}}

/* ---------- shell ---------- */
.shell{min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1120px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px;min-height:64px}
.tabs{display:flex;gap:4px;margin-left:8px}
.tabs a{color:var(--ink-2);text-decoration:none;font-weight:800;font-size:15px;padding:8px 14px;border-radius:999px}
.tabs a:hover{background:var(--surface-2);color:var(--ink)}
.tabs a[aria-current="page"]{background:var(--brand-soft);color:var(--brand)}
.kid-switch{margin-left:auto;display:flex;gap:8px;align-items:center}
.kid-chip{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:800}
.kid-chip[aria-pressed="true"]{border-color:var(--brand)}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#1E2430;font-size:15px;flex:none}
.main{flex:1;max-width:1120px;width:100%;margin:0 auto;padding:28px 20px 100px}
.bottom-tabs{display:none}
@media (max-width:760px){
  .tabs{display:none}
  .bottom-tabs{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .bottom-tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;text-decoration:none;color:var(--ink-3);font-size:12px;font-weight:800;border-radius:12px}
  .bottom-tabs a svg{width:22px;height:22px}
  .bottom-tabs a[aria-current="page"]{color:var(--brand);background:var(--brand-soft)}
  .kid-chip span.nm{display:none}
  .kid-chip{padding:4px}
  .main{padding-top:20px}
}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-head h1{font-size:clamp(28px,3.6vw,38px)}
.grid-2{display:grid;grid-template-columns:1.35fr 1fr;gap:20px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:900px){.grid-2{grid-template-columns:1fr}.grid-3{grid-template-columns:1fr}}
.pad{padding:22px}
.card h3{font-size:21px}
.section-title{font-family:var(--sans);font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--ink-3);margin:0 0 12px}

.today{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;padding:26px;background:linear-gradient(135deg,var(--brand) 0%,color-mix(in srgb,var(--brand) 78%,#000) 100%);color:var(--brand-ink);border:0;overflow:hidden;position:relative}
.today h2{font-size:clamp(26px,3.2vw,34px)}
.today p{opacity:.88;margin-top:8px;max-width:520px}
.today .btn-accent{margin-top:18px}
.today .meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.today .meta span{background:rgba(255,255,255,.14);border-radius:999px;padding:5px 12px;font-weight:800;font-size:14px}
.today .hero-art{width:200px}
@media (max-width:640px){.today{grid-template-columns:1fr}.today .hero-art{display:none}}

.kv{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--ink-2);font-weight:700}
.kv b{font-variant-numeric:tabular-nums}
.bigstat{font-family:var(--display);font-size:36px;font-weight:600;line-height:1}
.week-row{display:flex;gap:6px;margin-top:10px}
.week-row div{flex:1;text-align:center}
.week-row i{display:block;height:34px;border-radius:9px;background:var(--surface-3);margin-bottom:4px}
.week-row i.on{background:var(--brand)}
.week-row i.today{box-shadow:0 0 0 2px var(--accent) inset}
.week-row small{font-size:11.5px;font-weight:800;color:var(--ink-3)}
.bedtime{background:var(--sun-soft);border-radius:16px;padding:14px 16px;margin-top:14px}
.bedtime b{display:block;margin-bottom:3px}
.target-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tchip{display:inline-flex;align-items:baseline;gap:6px;background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:6px 12px;font-weight:800}
.tchip small{color:var(--ink-2);font-weight:700}

.lanes{display:grid;gap:14px}
.lane{padding:18px 20px}
.lane-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.lane-head h3{font-size:19px}
.lane-bar{height:8px;border-radius:5px;background:var(--surface-3);overflow:hidden;margin:10px 0 12px;display:flex}
.lane-bar b{background:var(--ok)}
.lane-bar i{background:var(--sun)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.sk{border:0;border-radius:10px;padding:6px 10px;font-weight:800;font-size:14.5px;cursor:pointer;font-family:var(--read);min-width:38px}
.sk[data-s="secure"]{background:var(--ok-soft);color:var(--ok)}
.sk[data-s="inferred"]{background:var(--ok-soft);color:var(--ok);opacity:.7;outline:1.5px dashed color-mix(in srgb,var(--ok) 50%,transparent);outline-offset:-2px}
.sk[data-s="emerging"]{background:var(--sun-soft);color:var(--warn)}
.sk[data-s="learning"]{background:var(--accent-soft);color:var(--accent)}
.sk[data-s="new"]{background:var(--idle-soft);color:var(--ink-3)}
.sk.is-target{box-shadow:0 0 0 2.5px var(--accent)}
.key{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;font-weight:800;color:var(--ink-2)}
.key span{display:inline-flex;align-items:center;gap:6px}
.key i{width:14px;height:14px;border-radius:4px;display:inline-block}

.list{display:grid}
.row{display:flex;gap:14px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;font-size:18px}
.row .grow{flex:1;min-width:0}
.row .grow b{display:block}
.errs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.err-chip{font-size:13px;background:var(--surface-2);border-radius:8px;padding:2px 8px;font-weight:700;color:var(--ink-2)}
.err-chip s{color:var(--bad);text-decoration:none}
.empty{text-align:center;padding:36px 20px;color:var(--ink-2)}
.empty .wren{margin:0 auto 12px;width:90px}

.sheet-back{position:fixed;inset:0;background:rgba(15,18,22,.45);z-index:60;display:grid;place-items:center;padding:16px;animation:fade .15s}
.sheet{background:var(--surface);border-radius:24px;max-width:480px;width:100%;padding:24px;box-shadow:var(--shadow-lg);max-height:90vh;overflow:auto}
.sheet h3{font-size:24px}
@keyframes fade{from{opacity:0}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;z-index:80;box-shadow:var(--shadow-lg);max-width:calc(100vw - 32px);animation:up .25s ease}
@keyframes up{from{transform:translate(-50%,12px);opacity:0}}
@media (max-width:760px){.toast{bottom:84px}}

/* ---------- kid mode ---------- */
.kid{position:fixed;inset:0;z-index:50;background:#FFF9EE;color:#1E2430;display:flex;flex-direction:column;overflow:auto;color-scheme:light}
.kid.w-space{background:#EEF0FB}.kid.w-ocean{background:#ECF7FA}.kid.w-forest{background:#F1F7EC}.kid.w-trucks{background:#F3F6FA}
.kid-top{display:flex;align-items:center;gap:12px;padding:14px 18px}
.kid-steps{display:flex;gap:6px;flex:1;max-width:420px;margin:0 auto}
.kid-steps i{flex:1;height:10px;border-radius:6px;background:rgba(30,36,48,.1)}
.kid-steps i.done{background:#2E5E4E}
.kid-steps i.now{background:#F2BD45}
.gate{position:relative;border:0;background:rgba(30,36,48,.07);color:#525A69;border-radius:999px;padding:8px 14px;font-weight:800;font-size:13px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none;overflow:hidden}
.gate b{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(46,94,78,.25);transition:width .1s linear}
.gate span{position:relative}
.kid-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 20px 28px;max-width:980px;width:100%;margin:0 auto}
.kid h1{font-family:var(--display);font-size:clamp(32px,5vw,52px);text-align:center;color:#1E2430}
.kid .say{font-size:clamp(18px,2.4vw,22px);text-align:center;color:#525A69;margin-top:10px;max-width:640px;font-weight:700}
.kid .btn-primary{background:#2E5E4E;color:#fff}
.kid .btn-ghost{color:#1E2430;border-color:rgba(30,36,48,.15);background:#fff}
.kid-big{min-height:72px;font-size:22px;padding:16px 36px;border-radius:999px}
.page-card{background:#fff;border-radius:28px;box-shadow:0 2px 0 rgba(30,36,48,.06),0 20px 50px rgba(30,36,48,.1);overflow:hidden;width:100%}
.page-card .scene{display:block;width:100%;height:auto;aspect-ratio:400/150;max-height:34vh}
.reader{font-family:var(--read);font-size:clamp(30px,4.8vw,50px);line-height:1.55;padding:24px 30px 16px;letter-spacing:.015em;word-spacing:.12em;color:#1E2430}
.reader.long{font-size:clamp(24px,3.6vw,38px)}
.reader .w{display:inline-block;border-radius:12px;padding:0 6px;margin:0 -2px;cursor:pointer;transition:background .2s,color .2s,box-shadow .2s;-webkit-tap-highlight-color:transparent}
.reader .w:hover{background:rgba(30,36,48,.05)}
.reader .w.read{color:#2C7A51}
.reader .w.miss{color:#B24A33}
.reader .w.now{background:#FCF0CF;box-shadow:0 0 0 3px #F2BD45 inset}
.reader .w.tgt{text-decoration:underline;text-decoration-color:#D8662F;text-decoration-thickness:4px;text-underline-offset:8px}
.reader .w.help{background:#E0EEF8}
.reader .w.flag{background:#F7E0D8;color:#B24A33}
.reader .w.wren-reads{color:#8E8A83}
.reader.hunt{text-align:center;display:flex;flex-wrap:wrap;gap:14px 20px;justify-content:center}
.reader.hunt .w{background:#FBE5D6;padding:8px 20px;border-radius:18px}
.reader.hunt .w.read{background:#DDF0E3}
.reader-bar{display:flex;align-items:center;gap:14px;padding:12px 18px 18px;flex-wrap:wrap}
.wren-talk{display:flex;align-items:center;gap:10px;flex:1;min-width:240px}
.wren-talk .bub{background:#F4EDE1;border-radius:18px 18px 18px 6px;padding:10px 14px;font-weight:800;font-size:17px;line-height:1.35}
.mic{width:76px;height:76px;border-radius:50%;border:0;background:#D8662F;color:#fff;cursor:pointer;display:grid;place-items:center;box-shadow:0 4px 0 #A94C1F;flex:none;position:relative}
.mic svg{width:32px;height:32px}
.mic.on{background:#2E5E4E;box-shadow:0 4px 0 #1B3B30}
.mic.on::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:4px solid rgba(46,94,78,.35);animation:pulse 1.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(.9);opacity:1}100%{transform:scale(1.25);opacity:0}}
.mode-note{font-size:13.5px;font-weight:700;color:#7A808C}
.phon{display:flex;gap:8px;justify-content:center;margin:14px 0 4px;flex-wrap:wrap}
.phon span{font-family:var(--read);font-size:40px;background:#fff;border-radius:16px;padding:6px 18px;box-shadow:0 2px 0 rgba(30,36,48,.08);border:2px solid #E7DDCC}
.phon span.hot{border-color:#D8662F;background:#FBE5D6}
.flash{font-family:var(--read);font-size:clamp(64px,12vw,120px);background:#fff;border-radius:36px;padding:28px 60px;box-shadow:0 2px 0 rgba(30,36,48,.06),0 20px 50px rgba(30,36,48,.1);margin:24px 0;min-width:280px;text-align:center}
.feathers{display:flex;gap:10px;justify-content:center;margin:18px 0}
.feather{width:54px;height:54px;animation:drop .8s cubic-bezier(.2,1.4,.4,1) both}
@keyframes drop{from{transform:translateY(-60px) rotate(-30deg);opacity:0}}
.celebrate .wren-svg{animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.wren-ring{animation:ring 1.6s ease-out infinite;transform-origin:64px 64px;color:#2E5E4E}
@keyframes ring{0%{transform:scale(.8);opacity:1}100%{transform:scale(1.1);opacity:0}}
.kid-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px}

/* report/results */
.res-hero{display:grid;grid-template-columns:repeat(4,1fr);gap:0}
.res-hero>div{padding:18px 20px;border-right:1px solid var(--line)}
.res-hero>div:last-child{border-right:0}
@media (max-width:760px){.res-hero{grid-template-columns:1fr 1fr}.res-hero>div:nth-child(2){border-right:0}.res-hero>div:nth-child(-n+2){border-bottom:1px solid var(--line)}}
.gap-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;background:var(--surface-2);border-radius:14px;margin-bottom:8px;flex-wrap:wrap}
.gap-row b{font-family:var(--read);font-size:19px}
.lvl-meter{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:10px}
.lvl-meter i{height:10px;border-radius:5px;background:var(--surface-3)}
.lvl-meter i.on{background:var(--brand)}
.print-only{display:none}
@media print{.topbar,.bottom-tabs,.no-print,.demo-banner{display:none!important}.main{padding:0}.card{box-shadow:none}}
</style>
</head>
<body>
<div id="app"><div class="boot"><div class="spinner" role="status" aria-label="Loading"></div></div></div>
<script type="module" src="app.js"></script>
</body>
</html>
